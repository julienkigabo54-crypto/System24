{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Find records</h2>
  <p class="hint">Choose a product to also see a chart of its stock and sales over time. You can narrow the list to a period of dates.</p>
  <div class="toolbar">
    <div class="field"><label for="product">Product</label><select id="product"></select></div>
    <div class="field"><label for="start">From date</label><input id="start" type="date"></div>
    <div class="field"><label for="end">To date</label><input id="end" type="date"></div>
    <div class="field" style="flex:0 0 190px"><label for="limit">How many records</label>
      <select id="limit"><option value="100">Up to 100</option><option value="200" selected>Up to 200</option><option value="500">Up to 500</option><option value="2000">Up to 2,000</option></select></div>
    <button class="primary" id="apply">Show records</button>
  </div>
  <div id="chartCard" hidden class="chart-box" style="margin-bottom:20px"><canvas id="chart" aria-label="Stock and sales over time"></canvas></div>
  <div class="table-wrap" id="rows"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/history.js') }}"></script>{% endblock %}
